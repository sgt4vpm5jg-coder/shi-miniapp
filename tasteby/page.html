<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>TASTE BY</title>
<script>try{if(!localStorage.getItem('tb_gate'))document.documentElement.classList.add('gated')}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css?v=17">
</head>
<body>
<main class="demo">
  <div class="wrap">
    <div class="d-note" id="note" hidden></div>
    <div id="pg"><p class="d-empty">Загружаю…</p></div>
    <div class="d-cta" id="cta" hidden>
      <h2>Хотите такую же страницу?</h2>
      <p>Выберите ник, добавьте свои находки и поделитесь ссылкой.</p>
      <a class="btn fill big" href="signup.html?role=creator">Создать свою страницу</a>
    </div>
  </div>
</main>
<footer class="h-foot h-foot2"><div class="wrap">
  <a href="https://t.me/shirooms" target="_blank" rel="noopener">В партнёрстве с SHI</a>
  <a href="partners.html">Брендам и магазинам</a>
</div></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="site.js?v=15"></script>
<script src="tb-page.js?v=1"></script>
<script>
TB.init({ noFooter: true });
(async () => {
  const h = (new URLSearchParams(location.search).get("u") || "").toLowerCase().replace(/[^a-z0-9_.]/g, "").slice(0, 30);
  const box = document.getElementById("pg"), note = document.getElementById("note");
  if (!h) { box.innerHTML = `<p class="d-empty">Страница не найдена</p>`; return; }
  const { data, error } = await TB.sb.rpc("get_page", { h });
  if (error || !data) {
    box.innerHTML = `<section class="d-top"><h1>Страница не найдена</h1><p>Возможно, автор ещё не опубликовал её.</p></section>`;
    document.getElementById("cta").hidden = false;
    return;
  }
  document.title = data.name + " — TASTE BY";
  const own = !!data.own;
  if (!data.published) { note.hidden = false; note.innerHTML = `Это предпросмотр: страница ещё не опубликована и видна только вам. <a href="cabinet.html">В кабинет</a>`; }
  else if (own) { note.hidden = false; note.innerHTML = `<a href="cabinet.html">← В кабинет</a>`; }
  TBPage.render(box, data, { shareUrl: location.origin + location.pathname + "?u=" + data.handle });
  document.getElementById("cta").hidden = own;
})();
</script>
</body>
</html>
