<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Вход — TASTE BY</title>
<script>try{if(!localStorage.getItem('tb_gate'))document.documentElement.classList.add('gated')}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css?v=16">
</head>
<body>
<main class="page">
  <div class="wrap"><div class="narrow">
    <h1>Вход</h1>
    <p class="lead">Рады видеть снова.</p>
    <form id="lf" novalidate>
      <label class="field"><span>Email</span><input name="email" type="email" required autocomplete="email" autocapitalize="off"></label>
      <label class="field"><span>Пароль</span><input name="password" type="password" required autocomplete="current-password"></label>
      <div class="msg" role="alert"></div>
      <button class="btn fill wide" type="submit">Войти</button>
    </form>
    <p class="alt"><a href="#" id="forgot">Забыли пароль?</a></p>
    <p class="alt">Нет аккаунта? <a href="signup.html">Создать</a></p>
  </div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="site.js?v=15"></script>
<script>
TB.init();
(() => {
  const f = document.getElementById("lf"), m = f.querySelector(".msg");
  TB.sb.auth.getSession().then(({ data }) => { if (data.session) location.replace("account.html"); });
  f.addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = f.email.value.trim(), password = f.password.value;
    if (!email || !password) return TB.msg(m, "Введите email и пароль");
    const btn = f.querySelector("[type=submit]"); btn.disabled = true;
    const { error } = await TB.sb.auth.signInWithPassword({ email, password });
    btn.disabled = false;
    if (error) return TB.msg(m, /invalid/i.test(error.message) ? "Неверный email или пароль" : "Не получилось войти, попробуйте ещё раз");
    location.href = "account.html";
  });
  // На тесте письма не отправляются: восстановление пароля включим к запуску
  document.getElementById("forgot").onclick = (e) => { e.preventDefault(); TB.msg(m, "На тесте восстановление пароля через поддержку. Напишите нам, и мы сбросим пароль.", true); };
})();
</script>
</body>
</html>
