<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Пример страницы — TASTE BY</title>
<script>try{if(!localStorage.getItem('tb_gate'))document.documentElement.classList.add('gated')}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css?v=16">
</head>
<body>
<main class="demo">
  <div class="wrap">
    <div class="d-note">Пример страницы автора. Ссылки в примере никуда не ведут.</div>
    <div class="d-other" id="other"></div>
    <section class="d-top" id="top"></section>
    <div class="chips2 d-cols" id="cols"></div>
    <div class="d-grid" id="grid"></div>
    <div class="d-cta">
      <h2>Хотите такую же страницу?</h2>
      <p>Выберите ник, добавьте свои находки и поделитесь ссылкой.</p>
      <a class="btn fill big" href="signup.html">Создать свою страницу</a>
    </div>
  </div>
</main>

<footer class="h-foot h-foot2"><div class="wrap">
  <a href="https://t.me/shirooms" target="_blank" rel="noopener">В партнёрстве с SHI</a>
  <a href="partners.html">Брендам и магазинам</a>
</div></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="site.js?v=15"></script>
<script src="demo-data.js?v=13"></script>
<script>
TB.init({ noFooter: true });
(() => {
  const a = TB_DEMO.find(new URLSearchParams(location.search).get("u"));
  let col = 0;
  const init = a.n.split(" ").map((w) => w[0]).join("");
  TB.$("#other").innerHTML = "Другие примеры: " + TB_DEMO.authors.filter((x) => x.u !== a.u).map((x) => `<a href="demo.html?u=${x.u}">${TB.esc(x.n)}</a>`).join(" · ");
  TB.$("#top").innerHTML = `<div class="d-av">${TB.esc(init)}</div>
    <small class="d-by">taste by</small>
    <h1>${TB.esc(a.n)}</h1>
    <p>${TB.esc(a.bio)}</p>
    <button class="d-addr" id="share">tasteby.ru/${a.u} <span>Поделиться</span></button>`;
  document.title = a.n + " — TASTE BY";
  TB.$("#share").onclick = async () => {
    const b = TB.$("#share span");
    try { await navigator.clipboard.writeText(location.href); b.textContent = "Ссылка скопирована"; } catch (e) { b.textContent = "Скопируйте адрес из строки браузера"; }
    setTimeout(() => (b.textContent = "Поделиться"), 2500);
  };
  const render = () => {
    TB.$("#cols").innerHTML = a.cols.map((c, i) => `<button class="${i === col ? "on" : ""}" data-i="${i}">${TB.esc(c.name)}</button>`).join("");
    TB.$("#grid").innerHTML = a.cols[col].items.map((x) => `<div class="d-it">
      <div class="ph" style="background-image:url('${x.img}')"></div>
      <b>${TB.esc(x.t)}</b><span class="shop">${TB.esc(x.shop)}</span>
      <a class="go" href="#" data-demo>На сайт ↗</a></div>`).join("");
  };
  TB.$("#cols").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; col = +b.dataset.i; render(); });
  TB.$("#grid").addEventListener("click", (e) => { const g = e.target.closest("[data-demo]"); if (!g) return; e.preventDefault(); g.textContent = "Это пример"; setTimeout(() => (g.textContent = "На сайт ↗"), 1500); });
  render();
})();
</script>
</body>
</html>
